<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>補天SRC | 漏洞提交平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
        }
        header {
            background: linear-gradient(to right, #1e5799, #2989d8);
            color: white;
            padding: 45px 30px;
            text-align: center;
        }
        h1 { font-size: 36px; margin-bottom: 8px; }
        .official { 
            font-size: 18px; 
            opacity: 0.95; 
            letter-spacing: 2px;
        }
        .status {
            display: inline-block;
            background: #2ecc71;
            color: white;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 14px;
            margin-top: 15px;
        }
        .main {
            padding: 50px 40px;
        }
        .success-box {
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
            border: 2px solid #2ecc71;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin-bottom: 40px;
        }
        .report-form {
            background: #f8f9fa;
            padding: 35px;
            border-radius: 12px;
            border: 1px solid #e9ecef;
        }
        .form-title {
            text-align: center;
            color: #1e5799;
            margin-bottom: 30px;
            font-size: 24px;
        }
        input, select, textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        .submit-btn {
            background: #e74c3c;
            color: white;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
        }
        .submit-btn:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
        .footer {
            text-align: center;
            padding: 25px;
            background: #f1f1f1;
            color: #555;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>補天安全信息共享平台</h1>
            <p class="official">Butian SRC · 官方漏洞報告系統</p>
            <div class="status">● 在線運行 · 已連接</div>
        </header>

        <div class="main">
            <div class="success-box">
                <h2>✅ 此網站為教育演示專案</h2>
                <p style="margin:15px 0 0 0; font-size:17px;">
                    用於展示「視覺欺騙漏洞」及「漏洞報告流程」<br>
                    所有提交均為模擬效果，不會傳送到真實後台
                </p>
            </div>

            <div class="report-form">
                <h2 class="form-title">提交漏洞報告</h2>
                
                <input type="text" value="視覺欺騙漏洞 - 偽造補天官方提交頁面" readonly>
                <input type="text" value=" jayjaychan0124-bit " readonly>
                
                <select>
                    <option>視覺欺騙 (Visual Spoofing)</option>
                    <option>釣魚攻擊</option>
                    <option>XSS 跨站腳本</option>
                </select>
                
                <textarea rows="6" readonly>發現攻擊者可透過精心設計的URL和視覺效果，誘導用戶誤以為自己正在訪問補天官方的「提交報告」頁面，實際上會執行惡意JavaScript程式碼，屬於典型的視覺欺騙漏洞。</textarea>
                
                <button onclick="submitDemo()" class="submit-btn">
                    提交報告給補天SRC
                </button>
            </div>
        </div>

        <div class="footer">
            <p>但天HK 網絡安全教育演示項目 | 2026年11月</p>
            <p style="margin-top:8px; font-size:13px;">GitHub Pages • main branch • 部署成功</p>
        </div>
    </div>

    <script>
        function submitDemo() {
            alert("✅ 報告提交成功！\n\n報告編號：BT-20261108-4782\n\n感謝您的貢獻！\n補天SRC安全團隊將在24小時內進行審核。\n\n（此為演示效果，並非真實提交）");
        }
    </script>
</body>
</html>
