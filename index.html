<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>補天SRC - 漏洞報告演示</title>
    <style>
        body { 
            font-family: "Microsoft YaHei", system-ui, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            margin: 0; 
            padding: 20px; 
            color: #333; 
            min-height: 100vh;
        }
        .container { 
            max-width: 800px; 
            margin: 40px auto; 
            background: white; 
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
            overflow: hidden;
        }
        header { 
            background: #2c3e50; 
            color: white; 
            padding: 40px; 
            text-align: center; 
        }
        h1 { 
            margin: 0; 
            font-size: 32px; 
        }
        .subtitle { 
            color: #bdc3c7; 
            margin-top: 10px; 
            font-size: 18px;
        }
        .content { 
            padding: 40px; 
            line-height: 1.8;
        }
        .success {
            background: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            margin: 20px 0;
        }
        .warning { 
            background: #fff3cd; 
            border-left: 6px solid #f39c12; 
            padding: 20px; 
            margin: 25px 0; 
            border-radius: 4px;
        }
        footer { 
            text-align: center; 
            padding: 25px; 
            background: #f8f9fa; 
            color: #666; 
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>補天SRC (Butian SRC)</h1>
            <p class="subtitle">公益漏洞報告演示平台</p>
        </header>
        
        <div class="content">
            <div class="success">
                ✅ 部署成功！這是 gh-pages 分支的正確頁面
            </div>
            
            <h2>視覺欺騙漏洞演示</h2>
            
            <div class="warning">
                <strong>⚠️ 注意：</strong><br>
                以下連結看似正常，但實際上會彈出警告。<br>
                這就是「視覺欺騙」類漏洞的危險性。
            </div>

            <p style="font-size:19px; margin:30px 0; line-height:2;">
                👉 <a href="#" onclick="alert('你已被欺騙！\n\n連結顯示為補天官方提交頁面，\n但實際執行了 JavaScript 程式碼。\n\n這就是視覺欺騙攻擊的手法。\n\n請提高警覺！'); return false;" style="color:#0066cc; text-decoration:underline;">
                https://butian.net/submit/report
                </a>
            </p>
            
            <hr>
            <p><strong>目前分支：</strong> gh-pages<br>
               <strong>部署狀態：</strong> 成功 ✅</p>
        </div>
        
        <footer>
            <p>但天HK 教育演示專案 | 2026</p>
        </footer>
    </div>
</body>
</html>
